<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>IELTS Reading - Admin</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        .container {
            width: min(1100px, 94%);
            margin: 40px auto;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
        }

        h2 {
            margin-top: 0;
        }

        .login-card {
            max-width: 450px;
            margin: 80px auto;
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            font-size: 15px;
            cursor: pointer;
        }

        .primary-button {
            width: 100%;
            margin-top: 22px;
            background: #1f2937;
            color: white;
        }

        .primary-button:hover {
            background: #111827;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .logout-button {
            background: #dc2626;
            color: white;
        }

        .section {
            margin-bottom: 25px;
        }

        .create-form {
            display: grid;
            grid-template-columns:
                1fr 1fr auto;
            gap: 12px;
            align-items: end;
        }

        .create-form label {
            margin-top: 0;
        }

        .create-button {
            background: #1f2937;
            color: white;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th,
        td {
            padding: 13px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
        }

        th {
            background: #f9fafb;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .status-active {
            background: #dcfce7;
            color: #166534;
        }

        .status-inactive {
            background: #fee2e2;
            color: #991b1b;
        }

        .admin-action-button {
            background: #e5e7eb;
            color: #111827;
            margin: 2px;
        }

        .reset-button {
            background: #fef3c7;
            color: #92400e;
        }

        .admin-message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }

        .admin-message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .admin-message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .loading-cell,
        .empty-cell,
        .error-cell {
            text-align: center;
            padding: 30px;
        }

        #adminLoading {
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,.75);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            font-size: 20px;
            font-weight: bold;
        }

        @media (max-width: 700px) {

            .container {
                margin: 20px auto;
            }

            .card {
                padding: 20px;
            }

            .topbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .create-form {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

    <div id="adminLoading">
        Processing...
    </div>


    <!-- ==========================================
         ADMIN LOGIN
    =========================================== -->

    <section
        id="adminLoginScreen"
        class="container"
    >

        <div class="card login-card">

            <h1>IELTS Admin</h1>

            <p>
                Teacher / Administrator Login
            </p>

            <form id="adminLoginForm">

                <label for="adminUsername">
                    Admin Username
                </label>

                <input
                    id="adminUsername"
                    type="text"
                    autocomplete="username"
                    required
                >

                <label for="adminPassword">
                    Admin Password
                </label>

                <input
                    id="adminPassword"
                    type="password"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="submit"
                    class="primary-button"
                >
                    Admin Login
                </button>

            </form>

            <div
                id="adminMessage"
                class="admin-message"
            ></div>

        </div>

    </section>


    <!-- ==========================================
         ADMIN PANEL
    =========================================== -->

    <section
        id="adminPanel"
        class="container"
        style="display:none;"
    >

        <div class="topbar">

            <div>

                <h1>
                    IELTS Reading Admin
                </h1>

                <div>
                    Logged in as:
                    <strong id="adminName">
                    </strong>
                </div>

            </div>

            <button
                id="adminLogout"
                class="logout-button"
            >
                Logout
            </button>

        </div>


        <!-- CREATE STUDENT -->

        <div class="card section">

            <h2>
                Create Student Account
            </h2>

            <form
                id="createStudentForm"
                class="create-form"
            >

                <div>

                    <label for="studentUsername">
                        Username
                    </label>

                    <input
                        id="studentUsername"
                        type="text"
                        placeholder="e.g. Bryan"
                        required
                    >

                </div>


                <div>

                    <label for="studentPassword">
                        Password
                    </label>

                    <input
                        id="studentPassword"
                        type="password"
                        placeholder="Minimum 6 characters"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="create-button"
                >
                    Create Student
                </button>

            </form>

        </div>


        <!-- STUDENTS -->

        <div class="card section">

            <div class="topbar">

                <div>

                    <h2>
                        Students
                    </h2>

                </div>

                <button
                    id="refreshStudents"
                    class="admin-action-button"
                >
                    Refresh
                </button>

            </div>


            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Student ID
                            </th>

                            <th>
                                Username
                            </th>

                            <th>
                                Created
                            </th>

                            <th>
                                Last Login
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                Actions
                            </th>

                        </tr>

                    </thead>

                    <tbody
                        id="studentsTableBody"
                    >

                    </tbody>

                </table>

            </div>

        </div>

    </section>


    <script src="Admin.js"></script>

</body>

</html>
